<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Health Checker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background: linear-gradient(to right, #518f94, #7ca8ab);
        }
        .sidebar {
            width: 200px;
            height: 100vh;
            background-color: #333;
            color: white;
            padding-top: 20px;
            position: fixed;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 15px;
            text-decoration: none;
            text-align: center;
        }
        .sidebar a:hover {
            background-color: #575757;
        } 
        .content {
            margin-left: 200px;
            padding: 20px;
            flex: 1;
        }
        h1 {
            text-align: center;
            color: black;
            animation: fadeIn 2s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        form {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="file"] {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #575757;
        }
        canvas {
            display: block;
            margin: 20px auto;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="{{ url_for('file_health') }}">File Health</a>
        <a href="{{ url_for('current_traffic') }}">Current Traffic</a>
    </div>
    <div class="content">
        <h1>Scale Safe Dashboard</h1>
        <form id="uploadForm">
            <button type="button" onclick="redirectToFileHealth()">Upload</button>
            <button type="button" onclick="redirectToCurrent()">Analyze</button>
        </form>
    </div>

    <script>
        function redirectToFileHealth() {
            window.location.href = "http://127.0.0.1:5000/file-health";
        }

        // File Upload Function with Hardcoded Response
        function uploadFile() {
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            // Simulate a successful response
            setTimeout(() => {
                const simulatedResponse = {
                    filename: file.name,
                    status: 'Healthy'
                };

                document.getElementById('file-result').innerText = `File: ${simulatedResponse.filename} | Status: ${simulatedResponse.status}`;
                updateFileTable(simulatedResponse.filename, simulatedResponse.status);

                // Redirect to the specified link
                window.location.href = "http://127.0.0.1:5000/file-health";
            }, 500); // Simulate a short delay
        }
        function redirectToCurrent() {
            window.location.href = "http://127.0.0.1:5000/current-traffic";
        }


        // Update File Table
        function updateFileTable(filename, status) {
            const table = document.getElementById('file-table');
            const tbody = table.querySelector('tbody');

            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            const statusCell = document.createElement('td');

            nameCell.innerText = filename;
            statusCell.innerText = status;

            row.appendChild(nameCell);
            row.appendChild(statusCell); 
            tbody.appendChild(row);

            table.hidden = false;
        }
    </script>
</body>
</html>
